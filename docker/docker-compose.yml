# =============================================================================
# E-Commerce Customer 360 Lakehouse - local infrastructure
#
#   Start:   docker compose up -d          (from this directory)
#   Status:  docker compose ps
#   Logs:    docker compose logs -f trino
#   Stop:    docker compose down           (add -v to also remove data volumes)
#
#   MinIO console:   http://localhost:9001   (minioadmin / minioadmin)
#   Trino UI:        http://localhost:8080
#
#   The Streamlit Customer 360 dashboard (http://localhost:8501) runs in the
#   local Python venv, not in Docker - see `make dashboard` / scripts/start_all.py.
#
# Every ${VAR} has a local default, so the stack works out of the box.
# To override, put values in the repo-root .env file (see .env.example).
#
#   Startup order:
#   postgres -> hive-jdbc-init -> hive-aws-init -> hive (metastore) -> trino
#   minio starts independently (ready in ~2s).
#   kafka starts independently; kafka-init (one-shot) creates the topics.
#   flink (jobmanager + taskmanager) starts after kafka + hive are healthy;
#   the stream JOB itself is submitted separately (make flink-up / flink-down).
#   First start takes a few minutes: the Hive Metastore initializes its
#   Postgres schema on first boot.
#
#   Kafka listeners:
#     PLAINTEXT  -> localhost:9092   (clients on the HOST: producer, scripts)
#     INTERNAL   -> kafka:9094       (clients in CONTAINERS: Flink, Phase 12+)
#     CONTROLLER -> :9093            (KRaft quorum, internal only)
# =============================================================================

name: ecommerce-lakehouse

# The default network is renamed so that container canonical hostnames
# (<container>.<network>) contain no underscores. The Hive 3.x metastore
# client used by Flink resolves the HMS host to its canonical name and parses
# it as a java.net.URI, which rejects underscores (URISyntaxException).
networks:
  default:
    name: lakehouse-net

services:
  # ---------------------------------------------------------------------------
  # MinIO - S3-compatible object storage (Iceberg data lake)
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Postgres - metadata database for the Hive Metastore
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16
    container_name: lakehouse-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hive}
      POSTGRES_DB: ${POSTGRES_DB:-hive}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # One-shot init: download the Postgres JDBC driver (needed by Hive) into a
  # shared aux-jars volume. Skips the download if the jar is already there
  # (volume persists across restarts; removed only by `docker compose down -v`).
  # hive-aws-init (below) stages the Hadoop AWS jars into the same volume.
  # ---------------------------------------------------------------------------
  hive-jdbc-init:
    image: curlimages/curl:8.12.1
    container_name: hive-jdbc-init
    # image default user (curl_user) cannot write the root-owned volume
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if [ ! -f /auxjars/postgresql.jar ]; then
          echo "Downloading Postgres JDBC driver -> /auxjars/postgresql.jar"
          curl -fsSL -o /auxjars/postgresql.jar \
            "${POSTGRES_JDBC_URL:-https://repo1.maven.org/maven2/org/postgresql/postgresql/42.7.7/postgresql-42.7.7.jar}"
        fi
        echo "Postgres JDBC driver ready at /auxjars/postgresql.jar"
    volumes:
      - hive-auxjars:/auxjars
    restart: "no"

  # ---------------------------------------------------------------------------
  # One-shot init: stage hadoop-aws + aws-java-sdk-bundle (present in the
  # apache/hive image but NOT on the metastore classpath) into a shared
  # volume. The hive service exposes it via HIVE_AUX_JARS_PATH. Without
  # hadoop-aws the HMS cannot validate s3a:// table locations (S3AFileSystem
  # ClassNotFound) and Iceberg table creation fails.
  # ---------------------------------------------------------------------------
  hive-aws-init:
    image: apache/hive:4.0.1
    container_name: hive-aws-init
    # image default user (hive) cannot write the root-owned volume
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        SRC=/opt/hadoop/share/hadoop/tools/lib
        if [ ! -f /auxjars/hadoop-aws.jar ] || [ ! -f /auxjars/aws-java-sdk-bundle.jar ]; then
          echo "Staging Hadoop AWS jars -> /auxjars"
          cp $${SRC}/hadoop-aws-*.jar /auxjars/hadoop-aws.jar
          cp $${SRC}/aws-java-sdk-bundle-*.jar /auxjars/aws-java-sdk-bundle.jar
        fi
        echo "Hadoop AWS jars ready at /auxjars"
    volumes:
      - hive-auxjars:/auxjars
    depends_on:
      - hive-jdbc-init
    restart: "no"

  # ---------------------------------------------------------------------------
  # Hive Metastore - Iceberg catalog metadata (Postgres backend).
  # Driven entirely by env vars (see the apache/hive image entrypoint):
  #   SERVICE_NAME=metastore, DB_DRIVER=postgres, HIVE_CUSTOM_CONF_DIR, ...
  # The entrypoint initializes the Postgres schema on first boot.
  # ---------------------------------------------------------------------------
  hive:
    image: apache/hive:4.0.1
    container_name: hive-metastore
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      HIVE_CUSTOM_CONF_DIR: /opt/hive/custom-conf
      HIVE_AUX_JARS_PATH: /opt/hive/auxjars
    ports:
      - "9083:9083"
    volumes:
      - ./hive/conf/hive-site.xml:/opt/hive/custom-conf/hive-site.xml:ro
      - ./hive/conf/core-site.xml:/opt/hive/custom-conf/core-site.xml:ro
      - hive-auxjars:/opt/hive/auxjars:ro
    depends_on:
      hive-aws-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/9083' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 36
      start_period: 60s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Trino - SQL query engine over Iceberg + raw bronze (single node, local dev).
  # The hive catalog (trino/catalog/hive.properties) uses Trino's native S3
  # filesystem (fs.s3.enabled) to read raw Parquet from MinIO - no Hadoop.
  # ---------------------------------------------------------------------------
  trino:
    image: trinodb/trino:483
    container_name: trino
    ports:
      - "8080:8080"
    volumes:
      - ./trino/config.properties:/etc/trino/config.properties:ro
      - ./trino/log.properties:/etc/trino/log.properties:ro
      - ./trino/jvm.config:/etc/trino/jvm.config:ro
      - ./trino/catalog/iceberg.properties:/etc/trino/catalog/iceberg.properties:ro
      - ./trino/catalog/hive.properties:/etc/trino/catalog/hive.properties:ro
    depends_on:
      minio:
        condition: service_healthy
      hive:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/v1/info"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Kafka - streaming bus (KRaft single node, no ZooKeeper).
  # Phase 11: topic raw.web_events feeds the streaming producer
  # (data_generator/stream_producer.py); Phase 12 consumes it via Flink.
  # ---------------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.7.2
    container_name: kafka
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,INTERNAL://0.0.0.0:9094,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: "-Xms256M -Xmx512M"
    ports:
      - "9092:9092" # host clients (producer, verify scripts)
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      # /opt/kafka/bin is not on the image's default PATH
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # One-shot init: create the streaming topics (idempotent, --if-not-exists).
  # Uses the INTERNAL listener (kafka:9094): the advertised address of the
  # host-facing PLAINTEXT listener (localhost:9092) is not reachable from
  # inside this container.
  # ---------------------------------------------------------------------------
  kafka-init:
    image: apache/kafka:3.7.2
    container_name: kafka-init
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "Creating Kafka topics (if not exists)..."
        for t in raw.web_events raw.orders raw.order_items raw.payments; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9094 \
            --create --topic "$$t" \
            --partitions 3 --replication-factor 1 --if-not-exists
        done
        echo "Kafka topics ready."
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"

  # ---------------------------------------------------------------------------
  # Flink - stream processing (Phase 12): Kafka raw.web_events -> Iceberg
  # bronze.stream_web_events. Image built from flink/ (Flink 1.20.3 + Iceberg
  # 1.9.1 runtime + Hadoop S3A for MinIO). Flink UI: http://localhost:8081.
  # core-site.xml (fs.s3a.*) is mounted on BOTH containers - the Iceberg
  # writers run on the taskmanager. Job lifecycle: make flink-up / flink-down.
  # ---------------------------------------------------------------------------
  flink-jobmanager:
    build:
      context: ../flink
    image: ecommerce-flink:1.20.3
    container_name: flink-jobmanager
    command: jobmanager
    environment:
      # Puts /opt/flink/conf (with the mounted core-site.xml) on the classpath
      # so Hadoop's Configuration() picks up the S3A/MinIO settings.
      HADOOP_CONF_DIR: /opt/flink/conf
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.memory.process.size: 1600m
        # Durable checkpoints on S3 (Phase 15): the flink-state bucket is
        # created by scripts/bootstrap_minio.py. S3A goes through the
        # flink-s3-fs-hadoop plugin + the mounted core-site.xml.
        state.checkpoints.dir: s3a://flink-state/checkpoints
        execution.checkpointing.interval: 10s
        execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
    ports:
      - "8081:8081" # Flink UI
    volumes:
      - ../flink/hadoop/core-site.xml:/opt/flink/conf/core-site.xml:ro
      - ../flink/sql:/opt/flink/sql:ro
    depends_on:
      kafka:
        condition: service_healthy
      hive:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/overview >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    restart: unless-stopped

  flink-taskmanager:
    image: ecommerce-flink:1.20.3
    container_name: flink-taskmanager
    command: taskmanager
    environment:
      HADOOP_CONF_DIR: /opt/flink/conf
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        # 8 slots: 4 stream jobs x (kafka source + iceberg sink) = 8 tasks.
        # 11264m (=> ~1.1GB task heap per slot): the Iceberg sink keeps one
        # open parquet/zstd writer per active partition until a checkpoint,
        # and each replay spans ~340-366 distinct date partitions - less
        # per-slot heap OOMed before the first checkpoint (Phase 12).
        taskmanager.numberOfTaskSlots: 8
        taskmanager.memory.process.size: 11264m
    volumes:
      - ../flink/hadoop/core-site.xml:/opt/flink/conf/core-site.xml:ro
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    restart: unless-stopped

volumes:
  minio-data:
  postgres-data:
  hive-auxjars:
  kafka-data:
