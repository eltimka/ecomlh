# Trino hive connector - reads the raw bronze landing zone on MinIO.
#
# Used by Phase 5 bronze assets: raw Parquet files are uploaded to
# s3a://bronze/raw/<table>/ and registered here as EXTERNAL tables
# (hive.bronze_raw.*), then loaded into Iceberg tables (iceberg.bronze.*).
#
# The metastore is the shared Hive Metastore (thrift). External tables
# don't store metadata there, but the schema (database) itself does.
connector.name=hive
hive.metastore=thrift
hive.metastore.uri=thrift://hive-metastore:9083

# ---------------------------------------------------------------------------
# Trino-native S3 filesystem (no Hadoop): Trino 4xx replaced Hadoop FS
# access with its own trino-filesystem-s3 module (AWS SDK v2). Enabling
# it binds the s3/s3a/s3n schemes; the s3.* properties point at MinIO.
# Local-dev credentials only (same as the MinIO service in docker-compose.yml).
# ---------------------------------------------------------------------------
fs.s3.enabled=true
s3.endpoint=http://minio:9000
s3.aws-access-key=minioadmin
s3.aws-secret-key=minioadmin
s3.region=us-east-1
s3.path-style-access=true
