# Trino catalog: Iceberg tables via Hive Metastore + MinIO (S3)
connector.name=iceberg
iceberg.catalog.type=hive_metastore

# Hive Metastore (Docker-internal service name)
hive.metastore.uri=thrift://hive:9083

# Native S3 file system (MinIO as S3-compatible backend).
# fs.s3.enabled switches the connector to Trino's native S3 client;
# without it the s3.* properties below are rejected.
fs.s3.enabled=true
s3.endpoint=http://minio:9000
s3.aws-access-key=${MINIO_ACCESS_KEY}
s3.aws-secret-key=${MINIO_SECRET_KEY}
s3.path-style-access=true
s3.region=${MINIO_REGION}
