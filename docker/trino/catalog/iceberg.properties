# Trino catalog: Iceberg tables via Hive Metastore + Garage (S3)
connector.name=iceberg
iceberg.catalog.type=hive_metastore

# Hive Metastore (Docker-internal service name)
hive.metastore.uri=thrift://hive:9083

# Native S3 file system (Garage as S3-compatible backend).
# fs.s3.enabled switches the connector to Trino's native S3 client;
# without it the s3.* properties below are rejected.
#
# Local-dev credentials are hardcoded below (no real secrets - see
# PROJECT.md: simple local Garage credentials). ${ENV_VAR} substitution in
# catalog files is not supported by Trino, so keep values explicit.
fs.s3.enabled=true
s3.endpoint=http://garage:3900
s3.aws-access-key=garageadmin
s3.aws-secret-key=garageadmin-local-dev-secret
s3.path-style-access=true
s3.region=garage
